<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Message App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 32px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    #messageBox {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    #messages {
      background: white;
      border-radius: 15px;
      padding: 25px;
      min-height: 400px;
      max-height: 500px;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .message {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message .name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 8px;
      opacity: 0.9;
    }
    
    .message .text {
      font-size: 15px;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    
    .message .time {
      font-size: 12px;
      opacity: 0.7;
    }
    
    input, textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }
    
    .no-messages {
      text-align: center;
      color: #999;
      padding: 80px 20px;
      font-size: 16px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 16px;
    }

    /* Scrollbar styling */
    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }

    .message-count {
      text-align: center;
      color: white;
      margin-bottom: 15px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container">
   <h1>💬 Message Board</h1>
   <div class="message-count" id="messageCount">
    Loading...
   </div><!-- Form to send message -->
   <div id="messageBox"><input type="text" id="nameInput" placeholder="Your name" maxlength="30" autocomplete="name"> <textarea id="messageInput" placeholder="Type your message... (Press Ctrl+Enter to send)" rows="3" maxlength="500"></textarea> <button id="sendBtn">Send Message 🚀</button>
    <div id="status"></div>
   </div><!-- Display messages -->
   <div id="messages">
    <div class="loading">
     ⏳ Loading messages...
    </div>
   </div>
  </div>
  <script type="module">
    // ========================================
    // IMPORT DETA - Using correct CDN
    // ========================================
    let Deta;
    try {
      const module = await import('https://cdn.jsdelivr.net/npm/deta@1.0.3/dist/index.mjs');
      Deta = module.Deta;
    } catch (error) {
      document.getElementById('messages').innerHTML = 
        '<div class="no-messages">❌ Could not load Deta library.<br><br>Make sure you have an internet connection.</div>';
      document.getElementById('status').innerHTML = 
        '<span style="color: red;">Connection error</span>';
      throw error;
    }

    // ========================================
    // CONNECT TO DETA DATABASE
    // ========================================
    // 🔑 REPLACE THIS with your real Deta project key!
    const PROJECT_KEY = 'YOUR_PROJECT_KEY_HERE';
    
    if (PROJECT_KEY === 'YOUR_PROJECT_KEY_HERE') {
      document.getElementById('messages').innerHTML = 
        '<div class="no-messages">⚠️ Please add your Deta Project Key!<br><br>' +
        '1. Go to <a href="https://deta.space" target="_blank">deta.space</a><br>' +
        '2. Create a collection<br>' +
        '3. Copy your project key<br>' +
        '4. Replace YOUR_PROJECT_KEY_HERE in the code</div>';
      document.getElementById('sendBtn').disabled = true;
    }

    const deta = Deta(PROJECT_KEY);
    const db = deta.Base('messages');

    // ========================================
    // SEND MESSAGE FUNCTION
    // ========================================
    async function sendMessage() {
      const nameInput = document.getElementById('nameInput');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const status = document.getElementById('status');
      
      const name = nameInput.value.trim();
      const messageText = messageInput.value.trim();
      
      // Validate inputs
      if (!name || !messageText) {
        status.innerHTML = '<span style="color: #e74c3c;">⚠️ Please enter both name and message</span>';
        return;
      }
      
      // Disable button and show loading
      sendBtn.disabled = true;
      sendBtn.textContent = '⏳ Sending...';
      status.innerHTML = '<span style="color: #667eea;">📤 Sending your message...</span>';
      
      try {
        // Save to database
        await db.put({
          name: name,
          message: messageText,
          timestamp: new Date().toISOString()
        });
        
        // Clear inputs
        messageInput.value = '';
        
        // Show success
        status.innerHTML = '<span style="color: #27ae60;">✅ Message sent successfully!</span>';
        
        // Reload messages
        await loadMessages();
        
        // Clear status after 3 seconds
        setTimeout(() => {
          status.textContent = '';
        }, 3000);
        
      } catch (error) {
        status.innerHTML = '<span style="color: #e74c3c;">❌ Error: ' + error.message + '</span>';
        console.error('Send error:', error);
      } finally {
        // Re-enable button
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Message 🚀';
      }
    }

    // ========================================
    // LOAD MESSAGES FUNCTION
    // ========================================
    async function loadMessages() {
      const messagesDiv = document.getElementById('messages');
      const messageCountDiv = document.getElementById('messageCount');
      
      try {
        // Fetch all messages
        const result = await db.fetch();
        
        // Update message count
        messageCountDiv.textContent = `📊 ${result.items.length} message${result.items.length !== 1 ? 's' : ''}`;
        
        // Check if empty
        if (result.items.length === 0) {
          messagesDiv.innerHTML = '<div class="no-messages">📭 No messages yet.<br><br>Be the first to post! 🎉</div>';
          return;
        }
        
        // Sort by newest first
        const sorted = result.items.sort((a, b) => 
          new Date(b.timestamp) - new Date(a.timestamp)
        );
        
        // Build HTML
        messagesDiv.innerHTML = sorted.map(item => {
          const date = new Date(item.timestamp);
          const timeString = date.toLocaleString();
          
          return `
            <div class="message">
              <div class="name">${escapeHtml(item.name)}</div>
              <div class="text">${escapeHtml(item.message)}</div>
              <div class="time">🕐 ${timeString}</div>
            </div>
          `;
        }).join('');
        
      } catch (error) {
        messagesDiv.innerHTML = '<div class="no-messages">❌ Error loading messages<br><br>' + error.message + '</div>';
        console.error('Load error:', error);
      }
    }

    // ========================================
    // HELPER: Escape HTML to prevent XSS
    // ========================================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ========================================
    // EVENT LISTENERS
    // ========================================
    
    // Send button click
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    
    // Ctrl+Enter to send
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ========================================
    // AUTO-REFRESH every 5 seconds
    // ========================================
    setInterval(loadMessages, 5000);

    // ========================================
    // LOAD MESSAGES ON START
    // ========================================
    loadMessages();
  </script>

</html>
