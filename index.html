< !DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡 P2P 傳訊器</title>
    <!-- 引入 PeerJS 函式庫 -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 15px; border-radius: 10px; max-width: 70%; word-wrap: break-word; }
        .me { align-self: flex-end; background: #dcf8c6; }
        .friend { align-self: flex-start; background: white; }
        .controls { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    我的 ID: <span id="my-id">連線中...</span>
</header>

<div id="chat">
    <div class="msg friend">系統：請將你的 ID 給朋友，或輸入朋友的 ID 連線。</div>
</div>

<!-- 連線控制區 -->
<div class="controls">
    <input type="text" id="remote-id" placeholder="輸入對方的 ID">
    <button onclick="connectToPeer()">連線</button>
</div>

<!-- 訊息輸入區 -->
<div class="controls">
    <input type="text" id="message" placeholder="輸入訊息...">
    <button onclick="sendMessage()">發送</button>
</div>

<script>
    const myIdDisplay = document.getElementById('my-id');
    const chatBox = document.getElementById('chat');
    const remoteIdInput = document.getElementById('remote-id');
    const messageInput = document.getElementById('message');

    // 1. 初始化 Peer 對象
    const peer = new Peer(); 
    let conn;

    // 當自己的 ID 產生時顯示出來
    peer.on('open', id => myIdDisplay.innerText = id);

    // 2. 監聽別人的連線
    peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        setupChat();
    });

    // 3. 主動連線功能
    function connectToPeer() {
        const id = remoteIdInput.value;
        if (id) {
            conn = peer.connect(id);
            setupChat();
        }
    }

    // 4. 設定通訊管道
    function setupChat() {
        conn.on('open', () => {
            appendMessage("系統: 已成功連線！", 'friend');
            // 接收數據
            conn.on('data', (data) => appendMessage(data, 'friend'));
        });
    }

    // 5. 發送訊息
    function sendMessage() {
        const msg = messageInput.value;
        if (conn && conn.open && msg) {
            conn.send(msg);
            appendMessage(msg, 'me');
            messageInput.value = "";
        } else {
            alert("尚未連線或訊息為空");
        }
    }

    // 顯示訊息到畫面上
    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight; // 自動捲動到底部
    }
</script>

</body>
</html>
